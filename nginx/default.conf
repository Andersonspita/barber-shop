server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Rotas do backend (Nest) — precisam bater com os prefixos reais das controllers.
    # `shop`, `waitlist` e `platform` faltavam: a lista de espera e as
    # configurações públicas da barbearia caíam no frontend e davam 404.
    # Estes prefixos são slugs reservados — nenhuma barbearia pode usá-los.
    location ~ ^/(auth|admin|appointments|schedule-blocks|services|barbers|shop|shops|waitlist|platform)(/|$) {
        proxy_pass http://backend:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tudo o mais vai para o frontend (Next.js)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
