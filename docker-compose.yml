services:
  db:
    image: postgres:15-alpine
    container_name: barbershop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: barbershop-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barbershop-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3333
      APP_URL: ${APP_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-barbearia}
      WHATSAPP_COUNTRY_CODE: ${WHATSAPP_COUNTRY_CODE:-55}
      REMINDER_HOURS_BEFORE: ${REMINDER_HOURS_BEFORE:-2}
      BIRTHDAY_GREETING_HOUR: ${BIRTHDAY_GREETING_HOUR:-9}
      # Multi-tenant: barbearia usada quando a requisição não diz qual é, e a
      # chave do painel /plataforma (vazia = painel desligado).
      DEFAULT_SHOP_SLUG: ${DEFAULT_SHOP_SLUG:-}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY:-}
      # Mensalidade: teste grátis, tolerância, antecedência da fatura e como pagar.
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-14}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-7}
      BILLING_INVOICE_DAYS_BEFORE: ${BILLING_INVOICE_DAYS_BEFORE:-5}
      BILLING_PAYMENT_INSTRUCTIONS: ${BILLING_PAYMENT_INSTRUCTIONS:-}
      # O fuso da barbearia fica no banco (configurável na tela de ajustes),
      # não aqui: o motor de agenda não depende mais do relógio do contêiner.
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: barbershop-frontend
    environment:
      # O servidor Next busca os dados de cada barbearia direto no backend,
      # pela rede interna — o NEXT_PUBLIC_API_URL vazio só serve ao navegador.
      API_INTERNAL_URL: http://backend:3333
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: barbershop-nginx
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
